name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

      - name: Check types
        run: bun run typecheck

      - name: Check all project code
        run: bun run knip

      - name: Check production code
        run: bun run knip:production

      - name: Validate content and lab routes
        run: bun run validate:content

      - name: Validate production content
        run: NODE_ENV=production bun run validate:content

      - name: Build production routes
        run: bun run build

      - name: Update public data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TURSO_COMMITS_DATABASE_URL: ${{ secrets.TURSO_COMMITS_DATABASE_URL }}
          TURSO_COMMITS_AUTH_TOKEN: ${{ secrets.TURSO_COMMITS_AUTH_TOKEN }}
        run: bun run update:data
