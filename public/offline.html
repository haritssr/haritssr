<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="rgb(252 252 252)" />
    <title>Offline · Harits Syah</title>
    <style>
      :root {
        --color-background: rgb(252 252 252);
        --color-foreground: #27272a;
        --color-muted: color-mix(
          in srgb,
          var(--color-foreground) 70%,
          var(--color-background)
        );
        --color-border: #d4d4d8;
        --color-action: color-mix(in oklab, #2563eb 60%, #3b82f6 40%);
        --color-action-hover: #1d4ed8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-background);
        color: var(--color-foreground);
        font:
          1rem/1.5 Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        align-items: center;
        min-height: 100dvh;
        padding: 4rem 1rem;
      }
      .container {
        width: 100%;
        max-width: 64rem;
        margin-inline: auto;
      }
      .content {
        max-width: 36rem;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin: 1.5rem 0 4rem;
      }
      h1 {
        margin: 0;
        font-size: 1.875rem;
        line-height: 1.2;
        font-weight: 700;
        text-wrap: balance;
      }
      .description {
        margin: 0;
        color: var(--color-muted);
        font-size: 1.125rem;
        overflow-wrap: break-word;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        border: 0 solid transparent;
        border-radius: 0.375rem;
        padding: 0.375rem 0.75rem;
        font: inherit;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 150ms,
          color 150ms;
      }
      .primary {
        background: var(--color-action);
        color: #fafafa;
      }
      .primary:hover {
        background: var(--color-action-hover);
      }
      .secondary {
        border-width: 1px;
        font-weight: 400;
        border-color: var(--color-border);
        background: #fafafa;
        color: var(--color-foreground);
      }
      .secondary:hover {
        background: #f4f4f5;
      }
      .action:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: 2px;
      }
      @media (min-width: 40rem) {
        main {
          padding-inline: 2rem;
        }
        h1 {
          font-size: 2.25rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .action {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="content">
          <header>
            <h1>You’re offline</h1>
            <p class="description">
              We couldn’t connect to this page. Check your connection, then try
              again to pick up where you left off.
            </p>
          </header>
          <div class="actions">
            <button
              class="action primary"
              onclick="window.location.reload()"
              type="button"
            >
              Try again
            </button>
            <a class="action secondary" href="/">Back to home</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
