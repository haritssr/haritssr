<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FAFCF2" />
    <title>Offline · Harits Syah</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #27272a;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      a {
        color: #1d4ed8;
        text-underline-offset: 0.2em;
      }
      a:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        This page needs an internet connection. Reconnect, then refresh to
        continue.
      </p>
      <p><a href="/">Try the homepage</a></p>
    </main>
  </body>
</html>
